<!DOCTYPE html>
<html lang="es" data-sn-theme="light" data-trio="plex">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectógrafo — Mapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./sistema/tokens.css">
  <link rel="stylesheet" href="./style.css">
  <!-- Pin "three" a una única instancia, igual que en static/index.html -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.183.2",
      "three/": "https://esm.sh/three@0.183.2/"
    }
  }
  </script>
</head>
<body>

  <header id="topbar">
    <div id="topbar-left">
      <a id="btn-biblioteca" class="btn-back" href="./index.html" title="Volver a la biblioteca" aria-label="Volver a la biblioteca">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <span id="app-name">Lectógrafo</span>
      <span id="topbar-chevron" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
      <span id="grafo-titulo" class="muted"></span>
      <div id="mapa-buscar-wrap">
        <input id="mapa-buscar" class="buscar-input" type="text"
               placeholder="Buscar concepto…" autocomplete="off" aria-label="Buscar concepto en el mapa">
        <ul id="mapa-buscar-dropdown" class="mapa-buscar-dropdown" role="listbox" hidden></ul>
      </div>
    </div>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="mapa">Mapa</button>
      <button class="tab-btn" data-tab="texto">Texto</button>
    </nav>
  </header>

  <!-- Mismo layout que el tab Mapa de la app: .tab-panel se posiciona
       bajo el topbar fijo (top: var(--sn-header-h)) — ver style.css -->
  <main id="tab-mapa" class="tab-panel">
    <div id="grafo-wrap">
      <div id="grafo-canvas">
        <svg id="grafo-svg" aria-label="Mapa de conceptos"></svg>
        <div id="grafo-3d" hidden aria-label="Mapa de conceptos en 3D"></div>

        <div id="grafo-controles">
          <button id="btn-fit" class="grafo-ctrl-btn" title="Ajustar vista">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
          <button id="btn-modo3d" class="grafo-ctrl-btn" title="Alternar vista 2D/3D">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </button>
          <details id="leyenda-wrap">
            <summary class="grafo-ctrl-btn" title="Tipos de relación">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z"/><path d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193"/><circle cx="10.5" cy="6.5" r=".5" fill="currentColor"/></svg>
            </summary>
            <div id="leyenda-tipos"></div>
          </details>
        </div>

        <!-- Overlay de tarjetas flotantes del mapa -->
        <div id="mapa-overlay">
          <svg id="mapa-arrows" aria-hidden="true">
            <defs>
              <marker id="mapa-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse">
                <path d="M0,0 L0,6 L8,3 z" fill="var(--sn-ink-faint)"/>
              </marker>
            </defs>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <main id="tab-texto" class="tab-panel" hidden>
    <div id="texto-wrap">
      <div id="texto-render"></div>
    </div>
  </main>

  <script type="module" src="./visor.js"></script>
</body>
</html>
